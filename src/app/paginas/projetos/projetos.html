<app-banner-pagina
  sobretitulo="PROJETOS SOCIAIS"
  titulo="Energia que volta para as pessoas."
  descricao="Destinamos 2% do nosso lucro a projetos de educação, meio ambiente e desenvolvimento das comunidades onde atuamos."
>
  <ul class="numeros">
    <li>
      <strong>35</strong>
      <span>projetos ativos</span>
    </li>
    <li>
      <strong>9</strong>
      <span>estados atendidos</span>
    </li>
    <li>
      <strong>2%</strong>
      <span>do lucro investido</span>
    </li>
  </ul>
</app-banner-pagina>

<section class="projetos" aria-label="Lista de projetos sociais">
  @for (projeto of projetos(); track projeto.id) {
    <app-card-projeto
      [categoria]="projeto.categoria"
      [nome]="projeto.nome"
      [descricao]="projeto.descricao"
      [local]="projeto.local"
      [impacto]="projeto.impacto"
    />
  }
</section>

<app-chamada />
