@if (noticia(); as n) {
  <app-banner-pagina
    [sobretitulo]="n.categoria + ' · ' + n.data"
    [titulo]="n.titulo"
    [descricao]="n.resumo"
  />

  <article class="post">
    <figure class="capa">
      <img [src]="n.imagem" [alt]="n.alt" />
      <figcaption>{{ n.legenda }}</figcaption>
    </figure>

    <div class="texto">
      @for (paragrafo of n.texto; track $index) {
        <p>{{ paragrafo }}</p>
      }

      <blockquote>
        <p>"{{ n.citacao }}"</p>
        <cite>{{ n.autor }}</cite>
      </blockquote>

      <a class="voltar" routerLink="/">← Voltar para o início</a>
    </div>
  </article>

  <section class="leia-tambem">
    <h2>Leia também</h2>

    <div class="leia-tambem__grade">
      @for (outra of noticias(); track outra.id) {
        @if (outra.id !== n.id) {
          <app-card-post
            [numero]="outra.id"
            [imagem]="outra.imagem"
            [alt]="outra.alt"
            [categoria]="outra.categoria"
            [data]="outra.data"
            [titulo]="outra.titulo"
            [resumo]="outra.resumo"
          />
        }
      }
    </div>
  </section>
}

<app-chamada />
