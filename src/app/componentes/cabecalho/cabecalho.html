
<header class="cabecalho">
  <a class="marca" routerLink="/" aria-label="Green Petroil — página inicial">
    <span class="marca__simbolo" aria-hidden="true">
      <img src="/imagens/logo.png" alt="" width="40" height="40" />
    </span>

    <span class="marca__texto">
      <strong>GREEN PETROIL</strong>
      <small>ENERGIA EM MOVIMENTO</small>
    </span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    (click)="alternarMenu()"
    [attr.aria-expanded]="menuAberto()"
    aria-controls="navegacao-principal"
    [attr.aria-label]="menuAberto() ? 'Fechar menu' : 'Abrir menu'"
  >
    @if (menuAberto()) {
      <span aria-hidden="true">✕</span>
    } @else {
      <span aria-hidden="true">☰</span>
    }
  </button>

  <nav
    id="navegacao-principal"
    class="navegacao"
    [class.navegacao--aberta]="menuAberto()"
    aria-label="Menu principal"
  >
     <a routerLink="/" routerLinkActive="ativo"
       [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'exact', fragment: 'exact', matrixParams: 'exact' }"
       ariaCurrentWhenActive="page" (click)="fecharMenu()">Início</a>
    <a routerLink="/sobre" routerLinkActive="ativo" ariaCurrentWhenActive="page" (click)="fecharMenu()">A empresa</a>
    <a routerLink="/" fragment="noticias" routerLinkActive="ativo"
       [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'exact', fragment: 'exact', matrixParams: 'exact' }"
       ariaCurrentWhenActive="page" (click)="fecharMenu()">Notícias</a>
    <a routerLink="/projetos" routerLinkActive="ativo" ariaCurrentWhenActive="page" (click)="fecharMenu()">Projetos Sociais</a>

    <a
      class="navegacao__contato"
      href="#contato"
      (click)="fecharMenu()"
    >
      Fale conosco
      <span aria-hidden="true">↗</span>
    </a>
  </nav>
</header>
